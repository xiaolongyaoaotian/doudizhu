<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>牌友斗地主 · 联机对战</title>
<style>
  :root{--gold:#e7c766;--cream:#f3efe2;--ink:#3a2c07;--sub:#9db8a8;--line:#1e5c48}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d3b2e;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--cream);min-height:100vh}
  #app[v-cloak]{display:none}
  .page{min-height:100vh;padding:20px 16px;display:flex;flex-direction:column;gap:12px;max-width:520px;margin:0 auto;width:100%}
  .head{display:flex;flex-direction:column;gap:4px}
  .title{font-size:20px;font-weight:800}
  .sub{font-size:11px;color:var(--sub)}
  .card{background:#124535;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .card-title{font-size:15px;font-weight:700}
  .hint{font-size:11px;color:var(--sub);line-height:1.5}
  .btn{border-radius:20px;padding:9px 0;font-size:14px;font-weight:700;text-align:center;color:var(--cream);background:#1f7a5c;border:1px solid #2a8f6d;cursor:pointer}
  .btn.primary{background:var(--gold);color:var(--ink);border-color:#d9b76e}
  .btn.ghost{background:transparent}
  .join-row{display:flex;gap:8px;align-items:center}
  .join-row .btn{padding:8px 14px;white-space:nowrap}
  .input{flex:1;background:#0d3b2e;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--cream);font-size:14px;outline:none;min-width:0;width:100%}
  .input:focus{border-color:var(--gold)}
  .err{font-size:12px;color:#f3b8b8;min-height:0}
  .link{font-size:12px;color:var(--sub);background:none;border:none;padding:8px;cursor:pointer;text-decoration:underline}
  .mask{position:fixed;inset:0;background:rgba(4,18,13,.92);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .panel{width:300px;max-width:94%;background:linear-gradient(180deg,#14493a,#0d3529);border:1px solid #e7c76666;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .panel h3{font-size:18px;font-weight:800;color:var(--gold);text-align:center}
</style>
</head>
<body>
<div id="app" v-cloak>
  <div class="page">
    <div class="head">
      <span class="title">联机对战</span>
      <span class="sub">{{ cfg.server || '未配置服务器' }}<template v-if="cfg.username"> · {{ cfg.username }}</template></span>
    </div>

    <div class="card" v-if="!netReady">
      <div class="card-title">连接服务器</div>
      <div class="hint">联机与好友对战需要服务器支持：填写服务器地址并登录服务器账号（与本地单机账号相互独立）。</div>
      <input class="input" v-model="server" placeholder="服务器地址，如 http://127.0.0.1:4180">
      <input class="input" v-model="name" placeholder="用户名" maxlength="16">
      <input class="input" v-model="pwd" type="password" placeholder="密码（至少 4 位）" maxlength="20" @keyup.enter="auth">
      <div class="err">{{ errMsg }}</div>
      <button class="btn primary" @click="auth">{{ mode === 'login' ? '登录服务器' : '注册并登录' }}</button>
      <button class="link" @click="mode = (mode === 'login' ? 'reg' : 'login'); errMsg = ''">{{ mode === 'login' ? '没有账号？注册' : '已有账号？登录' }}</button>
    </div>

    <template v-else>
      <div class="card" v-if="!matched">
        <div class="card-title">随机匹配</div>
        <div class="hint">与在线玩家匹配；30 秒内没有其他玩家，自动分配 AI 补位。</div>
        <button class="btn primary" :class="{ disabled: matching }" @click="startMatch">{{ matching ? `匹配中… ${wait}s（取消）` : '开始匹配' }}</button>
      </div>

      <div class="card" v-if="!matched">
        <div class="card-title">好友对战（房间）</div>
        <div class="hint">创建房间给好友输入房号加入；最多 3 人，未满员可由房主开始（补 AI），支持观战。</div>
        <button class="btn" @click="createRoom">创建房间</button>
        <div class="join-row">
          <input class="input" v-model="joinId" type="number" maxlength="6" placeholder="输入 6 位房号">
          <button class="btn" @click="joinRoom">加入</button>
          <button class="btn ghost" @click="spectateRoom">观战</button>
        </div>
        <div v-if="roomInfo" class="hint">房间 {{ roomInfo.id }}：{{ (roomInfo.players || []).map(p => p.name).join('、') || '等待玩家…' }}{{ roomInfo.spectators && roomInfo.spectators.length ? '（观战 ' + roomInfo.spectators.length + '）' : '' }}</div>
        <button v-if="isHost && roomInfo" class="btn primary" @click="startRoom">开始对局（缺位补 AI）</button>
      </div>

      <div class="card" v-if="matched">
        <div class="card-title">对局进行中</div>
        <div class="hint">{{ onlineGameId ? '已连接对局：' + onlineGameId : '等待分配…' }}</div>
        <button class="btn primary" @click="enterGame">进入牌桌</button>
        <button class="btn ghost" @click="leave">离开</button>
      </div>

      <div class="err">{{ errMsg }}</div>
      <button class="link" @click="back">返回大厅</button>
    </template>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<script type="module">
const { createApp, ref, onMounted } = Vue;

// uni 垫片：net.js 依赖 uni.getStorageSync / uni.request，网页版映射到 localStorage / fetch
globalThis.uni = {
  getStorageSync(k) { const v = localStorage.getItem(k); if (v == null) return ''; try { return JSON.parse(v); } catch (e) { return v; } },
  setStorageSync(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
  removeStorageSync(k) { localStorage.removeItem(k); },
  request(opt) {
    const { url, method = 'GET', data, header = {}, timeout = 8000 } = opt;
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), timeout);
    fetch(url, { method, headers: header, body: data ? JSON.stringify(data) : undefined, signal: ctl.signal })
      .then(r => r.json())
      .then(d => { clearTimeout(t); opt.success({ data: d && typeof d === 'object' ? d : { ok: false, error: '响应异常' } }); })
      .catch(() => { clearTimeout(t); opt.fail({ errMsg: '网络错误' }); });
  },
};
const net = await import('../common/net.js');

createApp({
  setup() {
    const cfg = ref(net.netConfig());
    const netReady = ref(net.isOnline());
    const mode = ref('login');
    const server = ref(cfg.value.server || '');
    const name = ref(cfg.value.username || '');
    const pwd = ref('');
    const errMsg = ref('');
    const matching = ref(false);
    const wait = ref(0);
    const joinId = ref('');
    const matched = ref(false);
    const onlineGameId = ref('');
    const roomInfo = ref(null);
    const isHost = ref(false);
    let pollTimer = null;

    function fail(e) { errMsg.value = (e && (e.error || e.message)) || '网络错误'; }

    function reconnect() {
      net.matchStatus().then(r => { if (r.ok && r.matched) { matched.value = true; onlineGameId.value = r.gameId; } });
    }

    function auth() {
      errMsg.value = '';
      if (!server.value.trim()) { errMsg.value = '请填写服务器地址'; return; }
      const p = mode.value === 'login'
        ? net.serverLogin(name.value.trim(), pwd.value, server.value.trim())
        : net.serverRegister(name.value.trim(), pwd.value, server.value.trim());
      p.then(r => {
        if (!r.ok) { fail(r); return; }
        cfg.value = net.netConfig();
        netReady.value = true;
        reconnect();
      });
    }

    function startMatch() {
      if (matching.value) { clearInterval(pollTimer); matching.value = false; net.matchCancel(); return; }
      errMsg.value = '';
      matching.value = true; wait.value = 0;
      net.matchJoin().then(r => {
        if (!r.ok) { fail(r); matching.value = false; return; }
        if (r.matched) { onMatched(r); return; }
        pollTimer = setInterval(() => {
          wait.value++;
          net.matchStatus().then(s => { if (s.ok && s.matched) { clearInterval(pollTimer); onMatched(s); } });
        }, 1000);
        setTimeout(() => {
          if (matching.value) net.matchJoin().then(r2 => { if (r2.ok && r2.matched) { clearInterval(pollTimer); onMatched(r2); } });
        }, Math.max(1000, (30 - wait.value) * 1000 + 500));
      });
    }
    function onMatched(r) { matching.value = false; matched.value = true; onlineGameId.value = r.gameId; }

    function createRoom() {
      errMsg.value = '';
      net.roomCreate().then(r => { if (!r.ok) { fail(r); return; } isHost.value = true; pollRoom(r.roomId); });
    }
    function joinRoom() {
      if (!joinId.value || joinId.value.length !== 6) { errMsg.value = '请输入 6 位房号'; return; }
      errMsg.value = '';
      net.roomJoin(joinId.value).then(r => { if (!r.ok) { fail(r); return; } isHost.value = false; pollRoom(joinId.value); });
    }
    function spectateRoom() {
      if (!joinId.value || joinId.value.length !== 6) { errMsg.value = '请输入 6 位房号'; return; }
      errMsg.value = '';
      net.roomSpectate(joinId.value).then(r => { if (!r.ok) { fail(r); return; } isHost.value = false; pollRoom(joinId.value); });
    }
    function pollRoom(roomId) {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => {
        net.roomState(roomId).then(r => {
          if (!r.ok) { fail(r); return; }
          if (r.game) { matched.value = true; onlineGameId.value = r.game.gameId; clearInterval(pollTimer); }
          else roomInfo.value = r.room;
        });
      }, 1500);
    }
    function startRoom() {
      net.roomStart(roomInfo.value.id).then(r => { if (!r.ok) { fail(r); return; } matched.value = true; onlineGameId.value = r.gameId; });
    }

    function enterGame() { location.href = 'index.html?online=' + encodeURIComponent(onlineGameId.value); }
    function leave() {
      if (pollTimer) clearInterval(pollTimer);
      if (onlineGameId.value) net.gameQuit(onlineGameId.value);
      if (roomInfo.value) net.roomLeave(roomInfo.value.id);
      matched.value = false; onlineGameId.value = ''; roomInfo.value = null; isHost.value = false;
    }
    function back() { location.href = 'index.html'; }

    onMounted(() => { if (netReady.value) reconnect(); });
    window.addEventListener('beforeunload', () => { if (pollTimer) clearInterval(pollTimer); });

    return { cfg, netReady, mode, server, name, pwd, errMsg, matching, wait, joinId, matched, onlineGameId, roomInfo, isHost, auth, startMatch, createRoom, joinRoom, spectateRoom, startRoom, enterGame, leave, back };
  }
}).mount('#app');
</script>
</body>
</html>
