<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 252" role="img" aria-label="朱凤牌背">
  <defs>
    <linearGradient id="ph-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c1626"/>
      <stop offset="1" stop-color="#4c0a14"/>
    </linearGradient>
    <linearGradient id="ph-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#96691c"/>
    </linearGradient>
    <pattern id="ph-scales" width="18" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12 a9 9 0 0 1 18 0" fill="none" stroke="#ffcf7d" stroke-width="1" opacity="0.16"/>
      <path d="M-9 6 a9 9 0 0 1 18 0 M9 6 a9 9 0 0 1 18 0" fill="none" stroke="#ffcf7d" stroke-width="1" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="180" height="252" rx="12" fill="url(#ph-bg)" stroke="url(#ph-gold)" stroke-width="5"/>
  <rect x="9" y="9" width="162" height="234" rx="8" fill="none" stroke="url(#ph-gold)" stroke-width="1.4" opacity="0.85"/>
  <rect x="16" y="16" width="148" height="220" rx="6" fill="#6b101d"/>
  <rect x="16" y="16" width="148" height="220" rx="6" fill="url(#ph-scales)"/>

  <!-- phoenix -->
  <g transform="translate(90 118)">
    <!-- tails -->
    <g fill="none" stroke="url(#ph-gold)" stroke-linecap="round">
      <path d="M0 26 q -10 34 -30 56" stroke-width="5"/>
      <path d="M0 26 q 0 40 2 62" stroke-width="6"/>
      <path d="M0 26 q 10 34 30 56" stroke-width="5"/>
      <path d="M0 26 q -22 22 -40 30" stroke-width="3.5" opacity="0.8"/>
      <path d="M0 26 q 22 22 40 30" stroke-width="3.5" opacity="0.8"/>
    </g>
    <g fill="url(#ph-gold)">
      <circle cx="-30" cy="82" r="3.4"/>
      <circle cx="2" cy="88" r="3.8"/>
      <circle cx="30" cy="82" r="3.4"/>
      <circle cx="-40" cy="56" r="2.6" opacity="0.8"/>
      <circle cx="40" cy="56" r="2.6" opacity="0.8"/>
      <!-- wings -->
      <path d="M-8 -6 q -30 -26 -52 -10 q 10 20 34 22 q 12 1 18 -12 z"/>
      <path d="M8 -6 q 30 -26 52 -10 q -10 20 -34 22 q -12 1 -18 -12 z"/>
      <path d="M-8 6 q -24 -10 -42 -2 q 14 14 34 12 q 8 -1 8 -10 z" opacity="0.85"/>
      <path d="M8 6 q 24 -10 42 -2 q -14 14 -34 12 q -8 -1 -8 -10 z" opacity="0.85"/>
      <!-- body -->
      <ellipse cx="0" cy="10" rx="13" ry="19"/>
      <!-- head + crest -->
      <circle cx="0" cy="-16" r="9"/>
      <path d="M-3 -24 q -6 -14 -14 -16 q 4 10 8 16 z"/>
      <path d="M0 -25 q 0 -14 2 -18 q 3 12 0 18 z"/>
      <path d="M3 -24 q 6 -14 14 -16 q -4 10 -8 16 z"/>
    </g>
    <!-- beak + eye -->
    <path d="M7 -18 q 8 1 12 4 q -7 3 -12 1 z" fill="url(#ph-gold)"/>
    <circle cx="2.5" cy="-18" r="1.8" fill="#5a0d16"/>
  </g>

  <!-- corner medallions -->
  <g fill="url(#ph-gold)" opacity="0.9">
    <circle cx="27" cy="29" r="4.5"/><path d="M27 20 q 3 -8 9 -9 q -3 8 -9 9 z"/>
    <circle cx="153" cy="29" r="4.5"/><path d="M153 20 q -3 -8 -9 -9 q 3 8 9 9 z"/>
    <circle cx="27" cy="223" r="4.5"/><path d="M27 232 q 3 8 9 9 q -3 -8 -9 -9 z"/>
    <circle cx="153" cy="223" r="4.5"/><path d="M153 232 q -3 8 -9 9 q 3 -8 9 -9 z"/>
  </g>

  <text x="90" y="234" text-anchor="middle" font-family="Kaiti SC, STKaiti, KaiTi, serif" font-size="15" fill="url(#ph-gold)" letter-spacing="6" opacity="0.95">朱雀</text>
</svg>
