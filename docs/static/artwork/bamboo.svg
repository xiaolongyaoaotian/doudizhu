<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 252" role="img" aria-label="竹韵牌背">
  <defs>
    <linearGradient id="bb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#176a4c"/>
      <stop offset="1" stop-color="#0a3826"/>
    </linearGradient>
    <linearGradient id="bb-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d68a"/>
      <stop offset="0.5" stop-color="#c9a24a"/>
      <stop offset="1" stop-color="#8f6d24"/>
    </linearGradient>
    <linearGradient id="bb-stalk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd3a2"/>
      <stop offset="0.5" stop-color="#5da97a"/>
      <stop offset="1" stop-color="#3f8460"/>
    </linearGradient>
  </defs>

  <rect width="180" height="252" rx="12" fill="url(#bb-bg)" stroke="url(#bb-gold)" stroke-width="5"/>
  <rect x="9" y="9" width="162" height="234" rx="8" fill="none" stroke="url(#bb-gold)" stroke-width="1.4" opacity="0.85"/>
  <rect x="16" y="16" width="148" height="220" rx="6" fill="#0d4531" stroke="#1e6b4e" stroke-width="1"/>

  <!-- bamboo stalks -->
  <g>
    <g stroke="#2e7a57" stroke-width="1.5" fill="url(#bb-stalk)">
      <!-- left stalk, slightly tilted -->
      <g transform="rotate(-6 52 126)">
        <rect x="46" y="34" width="12" height="52" rx="5"/>
        <rect x="46" y="94" width="12" height="52" rx="5"/>
        <rect x="46" y="154" width="12" height="52" rx="5"/>
      </g>
      <!-- middle stalk -->
      <g>
        <rect x="84" y="26" width="12" height="52" rx="5"/>
        <rect x="84" y="86" width="12" height="52" rx="5"/>
        <rect x="84" y="146" width="12" height="52" rx="5"/>
        <rect x="84" y="206" width="12" height="26" rx="5"/>
      </g>
      <!-- right stalk, slightly tilted -->
      <g transform="rotate(6 128 126)">
        <rect x="122" y="34" width="12" height="52" rx="5"/>
        <rect x="122" y="94" width="12" height="52" rx="5"/>
        <rect x="122" y="154" width="12" height="52" rx="5"/>
      </g>
    </g>
    <!-- leaves -->
    <g fill="#9fe0b4">
      <path d="M58 60 q 16 -14 30 -8 q -16 12 -30 8 z"/>
      <path d="M84 100 q -18 -12 -30 -4 q 16 11 30 4 z" opacity="0.9"/>
      <path d="M96 168 q 18 -12 30 -4 q -16 11 -30 4 z" opacity="0.9"/>
      <path d="M122 76 q -16 -13 -29 -7 q 15 12 29 7 z" opacity="0.8"/>
    </g>
  </g>

  <!-- center medallion -->
  <circle cx="90" cy="126" r="34" fill="#0a3826" stroke="url(#bb-gold)" stroke-width="2.5"/>
  <circle cx="90" cy="126" r="29" fill="none" stroke="#d9b45b" stroke-width="1" stroke-dasharray="3 4" opacity="0.8"/>
  <text x="90" y="140" text-anchor="middle" font-family="Kaiti SC, STKaiti, KaiTi, serif" font-size="40" fill="url(#bb-gold)" font-weight="bold">竹</text>

  <!-- corner cloud flourishes -->
  <g fill="url(#bb-gold)" opacity="0.9">
    <path d="M20 22 q 14 0 14 12 q -12 -4 -14 -12 z"/>
    <path d="M160 22 q -14 0 -14 12 q 12 -4 14 -12 z"/>
    <path d="M20 230 q 14 0 14 -12 q -12 4 -14 12 z"/>
    <path d="M160 230 q -14 0 -14 -12 q 12 4 14 12 z"/>
  </g>
</svg>
